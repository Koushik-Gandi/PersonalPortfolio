name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the build whenever you push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Crucial: Allows the action to push built files back to GitHub

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Use '18' or '20' depending on your Angular version
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        # For primary sites (username.github.io), the base-href must be "/"
        run: npm run build -- --configuration production --base-href /personal-portfolio/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: main # Primary github.io sites must serve from the 'main' branch
          folder: dist/personal-portfolio # DOUBLE CHECK: Path may vary by Angular version

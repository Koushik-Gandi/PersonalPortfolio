<h2 class="header text-center">Skills</h2>
<!-- Proficient Skills Section -->
<div *ngIf="getPrimarySkills().length > 0; else noProficientSkills">
  <h3 class="section-subtitle toggle-header" (click)="togglePrimary()">
    <i class="bi" [ngClass]="primaryExpanded ? 'bi-chevron-down' : 'bi-chevron-right'"></i>
    Primary Skills
  </h3>
  <div class="skills-container" *ngIf="primaryExpanded">
    <div class="skill-card" *ngFor="let skill of getPrimarySkills()">
      <div class="skill-ring" style="--percent: {{ skill.progress }}">
        <img src="{{ skill.image }}" alt="{{ skill.details }}" />
      </div>
      <span class="skill-percent">{{ skill.progress }}%</span>
      <h3>{{ skill.details }}</h3>
      <p>{{ skill.skill }}</p>
    </div>
  </div>
</div>
<ng-template #noProficientSkills></ng-template>
<br>
<!-- Knowledgeable Skills Section -->

<!-- Error Message -->
<ng-template #skillsNotAvailable>
  <h3 class="text-danger" #error>{{errorMsg}}</h3>
</ng-template>
